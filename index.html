<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="美丽大蜕变">
<title>美丽大蜕变</title>
<script src="ruffle.js"></script>
<style>
  *{-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;overscroll-behavior:none;
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;}
  body{
    background:radial-gradient(120% 120% at 50% 10%, #2b2b4d 0%, #14141f 55%, #0b0b14 100%);
    display:flex;align-items:center;justify-content:center;
    padding:env(safe-area-inset-top) env(safe-area-inset-right)
            env(safe-area-inset-bottom) env(safe-area-inset-left);
    box-sizing:border-box;
  }
  #wrap{
    width:min(100vw - env(safe-area-inset-left) - env(safe-area-inset-right),
              calc((100vh - env(safe-area-inset-top) - env(safe-area-inset-bottom)) * 700 / 550));
    width:min(100vw - env(safe-area-inset-left) - env(safe-area-inset-right),
              calc((100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom)) * 700 / 550));
    aspect-ratio:700/550;position:relative;
    background:#000;border-radius:12px;overflow:hidden;
    box-shadow:0 12px 48px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.06);
    touch-action:none;
  }
  ruffle-player{width:100%;height:100%;display:block;touch-action:none;}
  #loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    color:#fff;font-size:17px;background:#14141f;z-index:2;transition:opacity .4s;
    text-align:center;padding:0 24px;box-sizing:border-box;}
  #loading.hide{opacity:0;pointer-events:none;}
  #rotate-hint{
    display:none;position:fixed;top:calc(env(safe-area-inset-top) + 10px);left:50%;
    transform:translateX(-50%);z-index:10;pointer-events:auto;cursor:pointer;
    background:rgba(0,0,0,.55);color:#fff;font-size:13px;
    padding:8px 16px;border-radius:20px;backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);white-space:nowrap;
  }
  #savebar{
    position:fixed;left:calc(env(safe-area-inset-left) + 10px);bottom:calc(env(safe-area-inset-bottom) + 10px);
    z-index:20;display:flex;gap:6px;align-items:center;pointer-events:none;
    font-size:12px;
  }
  #savebar .chip,#savebar button{
    pointer-events:auto;border:1px solid rgba(255,255,255,.18);color:#fff;
    background:rgba(20,20,32,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    border-radius:16px;padding:6px 11px;cursor:pointer;font-size:12px;line-height:1;
    font-family:inherit;
  }
  #savebar .chip{cursor:default;}
  #savehelp{
    display:none;position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:30;
    width:min(88vw,430px);max-height:82vh;overflow:auto;background:#1b1b2b;color:#eee;
    border-radius:14px;padding:18px 20px;box-shadow:0 16px 60px rgba(0,0,0,.6);
    font-size:14px;line-height:1.75;
  }
  #savehelp.show{display:block;}
  #savehelp h3{margin:0 0 6px;font-size:16px;}
  #savehelp ol{margin:6px 0;padding-left:20px;}
  #savehelp .close{margin-top:10px;width:100%;padding:9px;border:none;border-radius:9px;
    background:#3d3d5c;color:#fff;font-size:14px;cursor:pointer;}
  @media (orientation:portrait){
    #rotate-hint{display:block;}
  }
  /* 小屏（手机）：存档按钮收进展开菜单，只留状态徽章+小箭头，不挤占画面 */
  #savemore{display:none;}
  #saveextra{display:contents;}
  @media (max-width:560px){
    #savemore{display:block;}
    #savebar{flex-wrap:wrap;max-width:calc(100vw - 20px);}
    #saveextra{display:none;order:-1;width:100%;}
    #savebar.open #saveextra{display:flex;gap:6px;flex-wrap:wrap;}
  }
</style>
</head>
<body>
<input type="file" id="importfile" accept=".json,application/json" style="display:none">
<div id="savebar">
  <span class="chip" id="savestate">💾 存档检测中…</span>
  <button id="savemore" type="button">▾</button>
  <span id="saveextra">
    <button id="savehelpbtn" type="button" style="display:none">存档被阻止？点这里</button>
    <button id="exportbtn" type="button">⬇ 导出存档</button>
    <button id="importbtn" type="button">⬆ 导入存档</button>
  </span>
</div>
<div id="savehelp">
  <h3>存档被浏览器阻止了</h3>
  <div>游戏进度保存在浏览器本地，但你的 Safari 现在不让网页存数据，刷新就会丢。按下面检查：</div>
  <ol>
    <li>打开 iPad「设置 → Safari 浏览器」，找到「阻止所有 Cookie」，把它<b>关掉</b>；</li>
    <li>不要用「无痕浏览」标签页打开本页（无痕模式关掉标签页数据就没了）；</li>
    <li>改好后刷新本页，左下角显示「💾」就是能存了。</li>
  </ol>
  <div>保险起见，也可以用下面的「导出存档」把进度存成文件，以后丢了一键导回。</div>
  <button class="close" id="savehelpclose" type="button">知道了</button>
</div>
<div id="rotate-hint">🔄 横过来玩，画面更大（点此关闭）</div>
<div id="wrap">
  <div id="loading">🎮 游戏加载中，请稍候…</div>
</div>
<script>
window.RufflePlayer = window.RufflePlayer || {};
window.RufflePlayer.config = {
  "autoplay": "on",
  "unmuteOverlay": "hidden",
  "splashScreen": false,
  "contextMenu": false,
  "scale": "showAll"
};
function fail(msg){
  var el = document.getElementById("loading");
  el.classList.remove("hide");
  el.textContent = msg;
}
window.addEventListener("load", function(){
  try {
    var ruffle = window.RufflePlayer.newest();
    var player = ruffle.createPlayer();
    document.getElementById("wrap").appendChild(player);
    player.load({ url: "game.swf" }).then(function(){
      document.getElementById("loading").classList.add("hide");
    }).catch(function(){
      fail("游戏加载失败，请检查网络后刷新重试");
    });
    setTimeout(function(){
      var el = document.getElementById("loading");
      if (!el.classList.contains("hide")) {
        el.textContent = "🎮 还在加载中（首次打开需要下载约 20MB 资源），请再耐心等一会儿…";
      }
    }, 15000);
  } catch(e) {
    fail("播放器初始化失败，请用 Safari 打开本页面");
  }
});

/* ==== 存档自检与备份 ====
   Ruffle 把游戏存档(SharedObject)写在本机 localStorage 里，值以 LSO 签名(AL8)开头 */
(function(){
  var PRE = "__fp_";
  var blocked = false, saveKeys = [];
  function lsGet(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
  function lsSet(k, v){ try { localStorage.setItem(k, v); return true; } catch(e){ return false; } }
  // 1) 写入是否被拒（阻止所有 Cookie / 异常设置时 setItem 会直接抛错）
  if (!lsSet(PRE + "probe", "1")) blocked = true;
  // 2) 同一标签页刷新过（sessionStorage 还在）但本地标记没了 → 数据没保住（无痕等）
  var wasAlive = false;
  try { wasAlive = !!sessionStorage.getItem(PRE + "alive"); sessionStorage.setItem(PRE + "alive", "1"); } catch(e){}
  var everSeen = !!lsGet(PRE + "seen");
  if (!blocked && wasAlive && !everSeen) blocked = true;
  lsSet(PRE + "seen", "1");
  function scanSaves(){
    saveKeys = [];
    try {
      for (var i = 0; i < localStorage.length; i++) {
        var k = localStorage.key(i);
        if (k && k.indexOf(PRE) !== 0) {
          var v = localStorage.getItem(k);
          if (v && v.indexOf("AL8") === 0) saveKeys.push(k);
        }
      }
    } catch(e){}
    return saveKeys.length > 0;
  }
  var chip = document.getElementById("savestate");
  var helpBtn = document.getElementById("savehelpbtn");
  function refresh(){
    if (blocked) {
      chip.textContent = "🔴 浏览器阻止了本地存档";
      helpBtn.style.display = "";
      return;
    }
    chip.textContent = scanSaves() ? "💾 存档已保存在本机" : "💾 暂无存档（过关后自动保存）";
  }
  refresh();
  setInterval(refresh, 3000);
  helpBtn.addEventListener("click", function(){
    document.getElementById("savehelp").classList.add("show");
  });
  document.getElementById("savehelpclose").addEventListener("click", function(){
    document.getElementById("savehelp").classList.remove("show");
  });
  document.getElementById("exportbtn").addEventListener("click", function(){
    scanSaves();
    if (!saveKeys.length) { alert("现在还没有存档，先玩一关再导出吧"); return; }
    var data = {};
    saveKeys.forEach(function(k){ data[k] = localStorage.getItem(k); });
    var blob = new Blob([JSON.stringify({game: "flash-play", saves: data}, null, 2)], {type: "application/json"});
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "美丽大蜕变-存档.json";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 4000);
  });
  var fileInput = document.getElementById("importfile");
  document.getElementById("importbtn").addEventListener("click", function(){ fileInput.click(); });
  fileInput.addEventListener("change", function(){
    var f = fileInput.files && fileInput.files[0];
    if (!f) return;
    var r = new FileReader();
    r.onload = function(){
      try {
        var obj = JSON.parse(String(r.result));
        var saves = obj.saves || obj;
        var n = 0;
        Object.keys(saves).forEach(function(k){
          if (typeof saves[k] === "string") { localStorage.setItem(k, saves[k]); n++; }
        });
        if (!n) { alert("这个文件里没有可用的存档"); return; }
        alert("存档已导入，刷新页面生效");
        location.reload();
      } catch(e){ alert("导入失败：文件格式不对"); }
    };
    r.readAsText(f);
    fileInput.value = "";
  });
})();

/* 竖屏横屏提示：常驻显示（本次手机适配的关键引导），点一下关闭，本次会话内不再打扰 */
(function(){
  var h = document.getElementById("rotate-hint");
  try { if (sessionStorage.getItem("__fp_rh")) h.style.display = "none"; } catch(e){}
  h.addEventListener("click", function(){
    h.style.display = "none";
    try { sessionStorage.setItem("__fp_rh", "1"); } catch(e){}
  });
})();
/* 小屏：存档展开菜单 */
document.getElementById("savemore").addEventListener("click", function(){
  document.getElementById("savebar").classList.toggle("open");
});
</script>
</body>
</html>
