<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="美丽大蜕变">
<title>美丽大蜕变</title>
<script src="ruffle.js"></script>
<style>
  *{-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;overscroll-behavior:none;
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;}
  body{
    background:radial-gradient(120% 120% at 50% 10%, #2b2b4d 0%, #14141f 55%, #0b0b14 100%);
    display:flex;align-items:center;justify-content:center;
    padding:env(safe-area-inset-top) env(safe-area-inset-right)
            env(safe-area-inset-bottom) env(safe-area-inset-left);
    box-sizing:border-box;
  }
  #wrap{
    width:min(100vw - env(safe-area-inset-left) - env(safe-area-inset-right),
              calc((100vh - env(safe-area-inset-top) - env(safe-area-inset-bottom)) * 700 / 547));
    width:min(100vw - env(safe-area-inset-left) - env(safe-area-inset-right),
              calc((100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom)) * 700 / 547));
    aspect-ratio:700/547;position:relative;
    background:#000;border-radius:12px;overflow:hidden;
    box-shadow:0 12px 48px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.06);
    touch-action:none;
  }
  ruffle-player{width:100%;height:100%;display:block;touch-action:none;}
  #loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    color:#fff;font-size:17px;background:#14141f;z-index:2;transition:opacity .4s;
    text-align:center;padding:0 24px;box-sizing:border-box;}
  #loading.hide{opacity:0;pointer-events:none;}
  #rotate-hint{
    display:none;position:fixed;top:calc(env(safe-area-inset-top) + 10px);left:50%;
    transform:translateX(-50%);z-index:10;pointer-events:none;
    background:rgba(0,0,0,.55);color:#fff;font-size:13px;
    padding:8px 16px;border-radius:20px;backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);white-space:nowrap;
  }
  @media (orientation:portrait){
    #rotate-hint{display:block;}
  }
</style>
</head>
<body>
<div id="rotate-hint">🔄 横屏体验更佳</div>
<div id="wrap">
  <div id="loading">🎮 游戏加载中，请稍候…</div>
</div>
<script>
window.RufflePlayer = window.RufflePlayer || {};
window.RufflePlayer.config = {
  "autoplay": "on",
  "unmuteOverlay": "hidden",
  "splashScreen": false,
  "contextMenu": false,
  "scale": "showAll"
};
function fail(msg){
  var el = document.getElementById("loading");
  el.classList.remove("hide");
  el.textContent = msg;
}
window.addEventListener("load", function(){
  try {
    var ruffle = window.RufflePlayer.newest();
    var player = ruffle.createPlayer();
    document.getElementById("wrap").appendChild(player);
    player.load({ url: "game.swf" }).then(function(){
      document.getElementById("loading").classList.add("hide");
    }).catch(function(){
      fail("游戏加载失败，请检查网络后刷新重试");
    });
    setTimeout(function(){
      var el = document.getElementById("loading");
      if (!el.classList.contains("hide")) {
        el.textContent = "🎮 还在加载中（首次打开需要下载约 20MB 资源），请再耐心等一会儿…";
      }
    }, 15000);
  } catch(e) {
    fail("播放器初始化失败，请用 Safari 打开本页面");
  }
});
/* 竖屏时 6 秒后自动收起提示 */
setTimeout(function(){
  var h = document.getElementById("rotate-hint");
  if (h) h.style.display = "none";
}, 6000);
</script>
</body>
</html>
